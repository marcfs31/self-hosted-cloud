version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
      typescript-eslint:
        patterns: ["typescript-eslint", "@typescript-eslint/*", "eslint", "@eslint/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
