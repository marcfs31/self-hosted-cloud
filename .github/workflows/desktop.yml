name: Desktop

# Unsigned builds of the menu-bar app (apps/desktop) for every version tag. The artifacts are
# plain zip/tar.gz files on the run page; signing and notarisation are not set up.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The packager downloads the Electron build of each target, so one runner can package
          # more than its own architecture (the app has no native modules).
          - { name: macos, os: macos-latest, targets: "darwin-arm64 darwin-x64" }
          - { name: windows, os: windows-latest, targets: "win32-x64" }
          - { name: linux, os: ubuntu-latest, targets: "linux-x64" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Only the two projects the package needs: a full install also compiles the API's native
      # modules (better-sqlite3), which the desktop app never loads.
      - run: pnpm install --frozen-lockfile --filter @cloud/desktop --filter @cloud/shared
      # Builds @cloud/shared and the app, stages the production dependencies and packages.
      - name: Package
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: pnpm --filter @cloud/desktop package $TARGETS
      # ditto keeps the symlinks inside a macOS bundle; the other archives do not need it.
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/out
        run: |
          for dir in Cloud-*; do ditto -c -k --keepParent "$dir" "$dir.zip"; done
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/out
        shell: pwsh
        run: |
          Get-ChildItem -Directory -Filter 'Cloud-*' | ForEach-Object {
            Compress-Archive -Path $_.FullName -DestinationPath "$($_.Name).zip"
          }
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/out
        run: |
          for dir in Cloud-*; do tar -czf "$dir.tar.gz" "$dir"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-desktop-${{ matrix.name }}
          path: |
            apps/desktop/out/*.zip
            apps/desktop/out/*.tar.gz
          if-no-files-found: error
          retention-days: 30
